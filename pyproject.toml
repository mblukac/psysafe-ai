[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "psysafe-ai"
version = "0.2.0.dev0"
description = "Calibrated psychological-safety classifiers for AI workflows."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Martin Lukac" },
]
keywords = [
    "ai-safety",
    "classification",
    "guardrails",
    "llm",
    "psychological-safety",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "jinja2>=3.1,<4",
    "pydantic>=2.10,<3",
]

[project.optional-dependencies]
openai = [
    "openai>=2,<3",
]
anthropic = [
    "anthropic>=0.49,<1",
]
transformers = [
    "torch>=2.2,<3",
    "transformers>=4.48,<6",
]
cli = [
    "typer>=0.15,<1",
]
legacy = [
    "aisuite>=0.1.11,<1",
    "python-dotenv>=1,<2",
]
all = [
    "aisuite>=0.1.11,<1",
    "anthropic>=0.49,<1",
    "openai>=2,<3",
    "python-dotenv>=1,<2",
    "torch>=2.2,<3",
    "transformers>=4.48,<6",
    "typer>=0.15,<1",
]

[project.urls]
Homepage = "https://github.com/mblukac/psysafe-ai"
Repository = "https://github.com/mblukac/psysafe-ai.git"
Issues = "https://github.com/mblukac/psysafe-ai/issues"

[tool.hatch.build.targets.wheel]
packages = ["psysafe"]

[tool.black]
line-length = 120
target-version = ["py310", "py311", "py312", "py313"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "C90", "N", "S", "B", "A", "COM", "LOG", "Q", "PT", "ISC", "ICN", "T20", "PYI", "BLE", "FBT"]
ignore = ["D203", "D212", "D407", "D416", "E501", "T201", "C901", "S314", "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107", "B904", "BLE001", "E402", "FBT001", "FBT002", "A001", "S110", "S701", "F401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D", "ANN", "ERA001", "FBT001", "FBT002", "PT006", "PT011", "PT018", "BLE001"]
"test_*.py" = ["S101", "D", "ANN", "ERA001", "FBT001", "FBT002", "PT006", "PT011", "PT018", "BLE001"]
"examples/**" = ["D", "T201", "S101"]

[tool.ruff.lint.isort]
known-first-party = ["psysafe", "tests"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --color=yes"
testpaths = ["tests"]
pythonpath = ["."]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[dependency-groups]
dev = [
    "aisuite>=0.1.11,<1",
    "anthropic>=0.49,<1",
    "black>=24.10,<27",
    "hatch>=1.14,<2",
    "mypy>=1.14,<2",
    "openai>=2,<3",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<2",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.14,<4",
    "python-dotenv>=1,<2",
    "ruff>=0.9,<1",
    "typer>=0.15,<1",
]
