[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "psysafe-ai"
version = "0.2.0.dev0"
description = "Calibrated psychological-safety classifiers for AI workflows."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Martin Lukac" },
]
keywords = [
    "ai-safety",
    "classification",
    "guardrails",
    "llm",
    "psychological-safety",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.10,<3",
]

[project.optional-dependencies]
openai = [
    "openai>=2,<3",
]
anthropic = [
    "anthropic>=0.117,<1",
]
all = [
    "anthropic>=0.117,<1",
    "openai>=2,<3",
]

[project.urls]
Homepage = "https://github.com/mblukac/psysafe-ai"
Repository = "https://github.com/mblukac/psysafe-ai.git"
Issues = "https://github.com/mblukac/psysafe-ai/issues"

[tool.hatch.build.targets.wheel]
packages = ["psysafe"]

[tool.black]
line-length = 120
target-version = ["py310", "py311", "py312", "py313"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "N", "S", "B", "A", "COM", "LOG", "Q", "PT", "ISC", "ICN", "PYI", "BLE", "RUF"]
ignore = ["COM812", "E501", "ISC001"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["psysafe", "tests"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --color=yes"
testpaths = ["tests"]
pythonpath = ["."]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[dependency-groups]
dev = [
    "anthropic>=0.117,<1",
    "black>=24.10,<27",
    "hatch>=1.14,<2",
    "mypy>=1.14,<2",
    "openai>=2,<3",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<2",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.14,<4",
    "ruff>=0.9,<1",
]
